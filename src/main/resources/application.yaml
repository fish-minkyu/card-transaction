spring.application.name=transaction
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cardpoint?serverTimezone=Asia/Seoul
    username: root
    password: root
  sql:
    init:
      mode: always          # 실행할 때마다 schema.sql, data.sql 실행
  batch:
    jdbc:
      initialize-schema: always   # 배치 메타 테이블 자동 생성
    job:
      enabled: false        # 앱 켤 때 배치가 멋대로 돌지 않게

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true   # card_id 컬럼 → cardId 필드 자동 매핑